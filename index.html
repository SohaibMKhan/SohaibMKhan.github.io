<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sohaib — Data Core</title>
<style>
:root{--bg:#02050a;--cyan:#68f6ff;--violet:#a884ff;--white:#f5f8fb;--muted:#8995a5}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.ui{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:28px;left:32px;right:32px;display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.2em;color:#aeb8c5;text-transform:uppercase}.status{display:flex;align-items:center;gap:9px}.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.hero{position:absolute;left:5.2vw;top:38vh;width:500px;transition:opacity .7s,transform .9s}.hero.away{opacity:0;transform:translate3d(-55px,0,0);visibility:hidden}.eyebrow{font:10px monospace;letter-spacing:.3em;color:#aeb8c5;text-transform:uppercase;margin-bottom:20px}.hero h1{font-size:clamp(58px,7vw,108px);line-height:.84;letter-spacing:-.07em;font-weight:450;margin:0}.hero h1 span{display:block}.soft{color:#d8dee7}.grad{background:linear-gradient(100deg,#f4fbff,#6af4ff 48%,#a783ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin-top:26px;max-width:410px;color:#8f9baa;font-size:14px;line-height:1.7}.hint{margin-top:28px;color:var(--cyan);font:10px monospace;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:11px}.mouse{width:17px;height:26px;border:1px solid #68f6ff99;border-radius:12px;position:relative}.mouse:after{content:'';position:absolute;left:7px;top:5px;width:2px;height:6px;border-radius:2px;background:var(--cyan);animation:scroll 1.5s infinite}@keyframes scroll{50%{transform:translateY(8px);opacity:.25}}
.side{position:absolute;right:3vw;top:50%;transform:translateY(-50%);font:9px monospace;letter-spacing:.18em;text-transform:uppercase;color:#566271}.nav{height:70px;padding-left:25px;position:relative}.nav:before{content:'';position:absolute;left:0;top:0;width:1px;height:70px;background:#9bdfff22}.nav:after{content:'';position:absolute;left:-3px;top:0;width:7px;height:7px;border-radius:50%;background:#596675}.nav.active{color:#f4f8fb}.nav.active:after{background:var(--cyan);box-shadow:0 0 14px var(--cyan)}.nav b{display:block;margin-bottom:8px}
.progress{position:absolute;left:3.3vw;right:3.3vw;bottom:18px;height:1px;background:#ffffff12}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px #68f6ff99}.progress:before,.progress:after{position:absolute;top:-12px;font:8px monospace;color:#66717f}.progress:before{content:'0%';left:0}.progress:after{content:'100%';right:0}
.project-label{position:fixed;z-index:8;width:min(440px,34vw);opacity:0;transition:opacity .45s,transform .55s;pointer-events:none;text-shadow:0 8px 30px #000;transform:translateY(10px)}.project-label.show{opacity:1;transform:translateY(0)}.project-label .kicker{font:9px monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:11px}.project-label.violet .kicker{color:#b79cff}.project-label h2{font-size:clamp(24px,2.2vw,38px);line-height:1.02;letter-spacing:-.045em;font-weight:450;margin:0}.project-label .rule{width:70px;height:1px;margin:15px 0;background:linear-gradient(90deg,var(--cyan),transparent)}.project-label.violet .rule{background:linear-gradient(90deg,var(--violet),transparent)}.project-label p{margin:0;color:#8d99a8;font:10px monospace;letter-spacing:.07em;line-height:1.6}
.project-index{position:fixed;z-index:8;left:5vw;bottom:8vh;color:#ffffff45;font:9px monospace;letter-spacing:.2em;text-transform:uppercase}.readout{position:fixed;right:5vw;bottom:8vh;color:#68f6ff99;font:9px monospace;letter-spacing:.2em;text-transform:uppercase}.scrollspace{height:900vh;position:relative;z-index:1}
@media(max-width:900px){.hero{left:7vw;width:70vw}.side{display:none}.project-label{width:300px}.project-label h2{font-size:24px}}@media(max-width:600px){.top{left:20px;right:20px}.hero{left:22px;width:82vw}.hero h1{font-size:54px}.project-label{width:260px}.project-label h2{font-size:21px}.project-index{display:none}}
</style>
</head>
<body>
<canvas id="webgl"></canvas>
<div class="ui">
<div class="top"><div>SOHAIB / DATA CORE</div><div class="status"><i class="dot"></i>SYSTEM ONLINE</div></div>
<div id="hero" class="hero"><div class="eyebrow">Data · Intelligence · Technology</div><h1><span>Build.</span><span class="soft">Connect.</span><span class="grad">Transform.</span></h1><div class="sub">An interactive portfolio where data, intelligence and software become one living system.</div><div class="hint"><span class="mouse"></span>Scroll to explore</div></div>
<div class="side"><div class="nav active"><b>01</b>Home</div><div class="nav"><b>02</b>About</div><div class="nav"><b>03</b>Work</div><div class="nav"><b>04</b>Skills</div><div class="nav"><b>05</b>Projects</div><div class="nav"><b>06</b>Contact</div></div>
<div class="project-index" id="stage">01 / DATA CORE</div><div class="readout" id="readout">CORE / HOME</div><div class="progress"><i id="bar"></i></div>
</div>
<div id="labels"></div><div class="scrollspace"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const projects=[
['Sprocket Central — Customer & Sales Intelligence','CUSTOMER INTELLIGENCE','01'],
['Credit Card Transaction Analysis','FINANCIAL ANALYTICS','02'],
['COVID-19 Data Analysis','GLOBAL HEALTH ANALYTICS','03'],
['Company Attrition Analytics','PEOPLE ANALYTICS','04'],
['Data-Driven Sales Analysis','COMMERCIAL ANALYTICS','05'],
['Google Play Store Apps Analysis','PRODUCT ANALYTICS','06'],
['Sales Data Analysis','SALES INTELLIGENCE','07']
];
const canvas=document.getElementById('webgl');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050a);scene.fog=new THREE.FogExp2(0x02050a,.035);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,0,11);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const world=new THREE.Group();world.position.set(1.1,0,0);scene.add(world);
const core=new THREE.Group();world.add(core);
// polished 3D core: solid faceted body + inner glass body + energy nucleus
const body=new THREE.Mesh(new THREE.IcosahedronGeometry(1.42,3),new THREE.MeshPhysicalMaterial({color:0x0a3440,emissive:0x06323e,emissiveIntensity:1.8,metalness:.55,roughness:.16,transparent:true,opacity:.72,transmission:.12,clearcoat:1,clearcoatRoughness:.12}));core.add(body);
const bodyWire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.45,3),new THREE.MeshBasicMaterial({color:0x74f7ff,wireframe:true,transparent:true,opacity:.32,blending:THREE.AdditiveBlending}));core.add(bodyWire);
const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(.91,3),new THREE.MeshPhysicalMaterial({color:0x17284d,emissive:0x24105b,emissiveIntensity:1.8,metalness:.2,roughness:.08,transparent:true,opacity:.66,transmission:.18,clearcoat:1}));core.add(inner);
const innerWire=new THREE.Mesh(new THREE.OctahedronGeometry(.98,2),new THREE.MeshBasicMaterial({color:0xb08aff,wireframe:true,transparent:true,opacity:.48,blending:THREE.AdditiveBlending}));core.add(innerWire);
const nucleus=new THREE.Mesh(new THREE.SphereGeometry(.22,48,48),new THREE.MeshBasicMaterial({color:0xffffff}));core.add(nucleus);
const glow=new THREE.Mesh(new THREE.SphereGeometry(.52,32,32),new THREE.MeshBasicMaterial({color:0x68f6ff,transparent:true,opacity:.10,blending:THREE.AdditiveBlending,depthWrite:false}));core.add(glow);
const cyanLight=new THREE.PointLight(0x68f6ff,25,7);core.add(cyanLight);const violetLight=new THREE.PointLight(0xa783ff,14,5);violetLight.position.set(1,.8,1);core.add(violetLight);
// restrained orbital structure
const rings=[];for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(1.7+i*.26,.009,8,220),new THREE.MeshBasicMaterial({color:i%2?0x9b79ff:0x68f6ff,transparent:true,opacity:.24,blending:THREE.AdditiveBlending}));r.rotation.set(.35+i*.43,.2+i*.27,.1+i*.55);core.add(r);rings.push(r)}
// particles close to the core
const orbiters=[];for(let i=0;i<32;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.018+(i%4)*.009,12,12),new THREE.MeshBasicMaterial({color:i%3===0?0xa984ff:0x68f6ff}));m.userData={a:i/32*Math.PI*2,r:1.55+(i%7)*.16};core.add(m);orbiters.push(m)}
// distant network
const network=new THREE.Group();scene.add(network);const stars=[];for(let i=0;i<500;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.008+(i%5)*.004,6,6),new THREE.MeshBasicMaterial({color:i%9===0?0xa884ff:0x68f6ff,transparent:true,opacity:.35+(i%6)*.07}));m.position.set((Math.random()-.5)*14,(Math.random()-.5)*8,(Math.random()-.5)*7);network.add(m);stars.push(m)}
// project nodes: they emerge one at a time from the core, never as cards
const nodeGroup=new THREE.Group();scene.add(nodeGroup);const nodes=[];
const positions=[[-3.3,2.0,.2],[3.35,1.55,-.2],[-3.65,-.1,.1],[3.5,-.55,.2],[-2.9,-2.0,-.1],[2.95,-2.1,.2],[.1,-3.0,-.25]];
projects.forEach((p,i)=>{
 const g=new THREE.Group();g.position.set(0,0,0);nodeGroup.add(g);
 const halo=new THREE.Mesh(new THREE.SphereGeometry(.34,24,24),new THREE.MeshBasicMaterial({color:i%2?0xa884ff:0x68f6ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(halo);
 const node=new THREE.Mesh(new THREE.IcosahedronGeometry(.13,2),new THREE.MeshPhysicalMaterial({color:i%2?0x6242a8:0x167887,emissive:i%2?0x7e55ff:0x34ddea,emissiveIntensity:2.4,metalness:.35,roughness:.14,transparent:true,opacity:0,clearcoat:1}));g.add(node);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.22,.007,6,80),new THREE.MeshBasicMaterial({color:i%2?0xa884ff:0x68f6ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));g.add(ring);
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(...positions[i])]),new THREE.LineBasicMaterial({color:i%2?0xa884ff:0x68f6ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));scene.add(line);
 nodes.push({g,node,halo,ring,line,target:new THREE.Vector3(...positions[i])});
 const label=document.createElement('div');label.className='project-label'+(i%2?' violet':'');label.innerHTML='<div class="kicker">'+p[2]+' / '+p[1]+'</div><h2>'+p[0]+'</h2><div class="rule"></div><p>POWER BI · SCROLL TO NEXT SYSTEM</p>';document.getElementById('labels').appendChild(label);nodes[i].label=label;
});
let targetScroll=0,scroll=0,mx=0,my=0,sx=0,sy=0;addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2});addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;targetScroll=max?scrollY/max:0},{passive:true});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t);
function frame(t){requestAnimationFrame(frame,t);scroll+=(targetScroll-scroll)*.055;sx+=(mx-sx)*.045;sy+=(my-sy)*.045;
 const p=scroll;document.getElementById('bar').style.width=p*100+'%';document.getElementById('hero').classList.toggle('away',p>.075);
 const workStart=.105,step=.115;const active=clamp(Math.floor((p-workStart)/step),-1,6);const local=active<0?0:clamp((p-(workStart+active*step))/step,0,1);const eased=ease(local);
 document.getElementById('stage').textContent=active<0?'01 / DATA CORE':'02 / POWER BI · NODE '+String(active+1).padStart(2,'0');document.getElementById('readout').textContent=active<0?'CORE / HOME':'NODE '+String(active+1).padStart(2,'0')+' / ACTIVE';
 camera.position.x+=(sx*.55-camera.position.x)*.035;camera.position.y+=(-sy*.35-camera.position.y)*.035;camera.lookAt(0,0,0);world.rotation.y+=(sx*.06-world.rotation.y)*.025;world.rotation.x+=(-sy*.04-world.rotation.x)*.025;
 const coreOpen=ease(clamp((p-.02)/.32,0,1));const coreScale=1+coreOpen*.10;core.scale.lerp(new THREE.Vector3(coreScale,coreScale,coreScale),.05);core.rotation.y+=.0028+coreOpen*.004;body.rotation.z+=.0012;bodyWire.rotation.y+=.003;inner.rotation.x-=.002;innerWire.rotation.z+=.004;nucleus.scale.setScalar(1+Math.sin(t*.0025)*.08+coreOpen*.18);glow.scale.setScalar(1+Math.sin(t*.0018)*.08+coreOpen*.3);
 rings.forEach((r,i)=>{r.rotation.x+=.0008*(i+1);r.rotation.y+=.00045*(i+1);r.material.opacity=.19+coreOpen*.07});orbiters.forEach((o,i)=>{const u=o.userData;const a=u.a+t*.00035*(1+i%4);const r=u.r+coreOpen*.28;o.position.set(Math.cos(a)*r,Math.sin(a*1.37)*r*.5,Math.sin(a)*r*.65)});
 stars.forEach((s,i)=>{s.position.z+=.0015*(i%3-1);if(s.position.z>3.5)s.position.z=-3.5});
 nodes.forEach((d,i)=>{const start=workStart+i*step;const q=ease(clamp((p-start)/.09,0,1));d.g.position.lerp(d.target,q*.12+.02);d.g.scale.setScalar(.01+q*.99);d.node.material.opacity=q;d.halo.material.opacity=q*.12;d.ring.material.opacity=q*.7;d.ring.rotation.z+=.004;d.line.material.opacity=q*(i===active?.48:.035);
  const pulse=i===active?1+Math.sin(t*.004)*.09:1;d.node.scale.setScalar(pulse);d.halo.scale.setScalar(i===active?1.35:1);
  const v=d.g.position.clone().project(camera);const x=(v.x*.5+.5)*innerWidth;const y=(-v.y*.5+.5)*innerHeight;const side=i%2?28:-330;d.label.style.left=(x+side)+'px';d.label.style.top=(y-20)+'px';d.label.classList.toggle('show',i===active&&q>.7&&p<.93);
 });
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script>
</body></html>
