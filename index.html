<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sohaib — Data Intelligence</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#030408;color:#f5f7fb;font-family:Inter,Arial,sans-serif;overflow-x:hidden}#scene{position:fixed;inset:0;width:100%;height:100%;display:block;background:#030408}.hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:28px 34px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.18em;font-size:10px;opacity:.74}.status{display:flex;gap:9px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#7ff7ff;box-shadow:0 0 18px #7ff7ff}.hero{margin:auto 0 11vh;max-width:720px}.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.56;margin-bottom:18px}h1{margin:0;font-size:clamp(50px,8vw,118px);line-height:.88;letter-spacing:-.065em;font-weight:500}h1 span{display:block}.accent{opacity:.78}.sub{margin-top:28px;max-width:470px;font-size:15px;line-height:1.7;color:#aeb5c0}.scroll{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}.line{width:54px;height:1px;background:#777}.section{height:500vh;position:relative;z-index:4;pointer-events:none}.marker{position:absolute;left:34px;top:0;height:100vh;display:flex;align-items:center}.marker span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.28em;text-transform:uppercase;opacity:.2}.badge{position:fixed;right:34px;bottom:30px;z-index:5;font:9px monospace;letter-spacing:.15em;opacity:.28}@media(max-width:700px){.hud{padding:22px}.hero{margin-bottom:13vh}.marker{left:22px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud"><div class="top"><div>SOHAIB / DATA CORE</div><div class="status"><i class="dot"></i>SYSTEM ONLINE</div></div><div class="hero"><div class="eyebrow">Data · Intelligence · Technology</div><h1><span>Build.</span><span class="accent">Connect.</span><span>Transform.</span></h1><div class="sub">An interactive portfolio where data, intelligence and software become one living system.</div></div><div class="scroll"><div class="line"></div>Move your cursor · Scroll to activate</div></div>
<div class="section"><div class="marker"><span>01 — CORE FORMATION</span></div></div><div class="badge">PORTFOLIO / 01</div>
<script>
(()=>{const c=document.getElementById('scene'),x=c.getContext('2d'),M=Math.min(devicePixelRatio||1,2);let W,H,t=0,sc=0,target=0;const mouse={x:innerWidth*.72,y:innerHeight*.5},sm={...mouse},N=900,P=[];function size(){W=innerWidth;H=innerHeight;c.width=W*M;c.height=H*M;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(M,0,0,M,0,0)}addEventListener('resize',size);size();for(let i=0;i<N;i++){let a=Math.random()*6.283,r=150+Math.random()*Math.max(W,H)*.65;P.push({x:Math.cos(a)*r,y:(Math.random()-.5)*Math.max(W,H)*.8,z:Math.sin(a)*r,sx:Math.cos(a)*r,sy:(Math.random()-.5)*Math.max(W,H)*.8,sz:Math.sin(a)*r,p:Math.random()*6.283,size:.5+Math.random()*1.5,h:Math.random()})}addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('scroll',()=>{let m=document.documentElement.scrollHeight-innerHeight;target=m?scrollY/m:0},{passive:true});addEventListener('wheel',e=>target=Math.max(0,Math.min(1,target+e.deltaY/innerHeight*.12)),{passive:true});const L=(a,b,t)=>a+(b-a)*t,proj=(a,b,z)=>{let s=720/Math.max(150,720+z);return{x:W*.6+a*s,y:H*.49+b*s,s}};
function core(f){let cx=W*.6,cy=H*.49;x.save();x.translate(cx,cy);let g=x.createRadialGradient(0,0,0,0,0,190);g.addColorStop(0,'rgba(140,255,255,.3)');g.addColorStop(.3,'rgba(90,150,255,.08)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,190,0,6.283);x.fill();let n=x.createRadialGradient(-10,-14,2,0,0,60+f*14);n.addColorStop(0,'rgba(255,255,255,.98)');n.addColorStop(.14,'rgba(150,255,255,.85)');n.addColorStop(.4,'rgba(55,210,255,.3)');n.addColorStop(1,'rgba(30,80,180,0)');x.fillStyle=n;x.beginPath();x.arc(0,0,62+f*14,0,6.283);x.fill();x.rotate(t*.08);for(let k=0;k<3;k++){let r=(68+k*22)*(1+f*.16);x.beginPath();for(let i=0;i<=12;i++){let a=i/12*6.283,xx=Math.cos(a)*r,yy=Math.sin(a)*r*.72;if(!i)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.closePath();x.strokeStyle=k===1?'rgba(165,125,255,.7)':'rgba(105,250,255,.7)';x.lineWidth=1.1;x.stroke()}for(let k=0;k<5;k++){let r=(110+k*25)*(1+f*.18);x.save();x.rotate(t*(.035+k*.012)+k*.628);x.beginPath();x.ellipse(0,0,r,r*(.22+k*.045),0,0,6.283);x.strokeStyle=k%2?'rgba(135,100,255,.42)':'rgba(100,245,255,.48)';x.stroke();x.restore()}for(let i=0;i<12;i++){let a=t*.35+i*.524,r=145+Math.sin(t+i)*10+f*35,xx=Math.cos(a)*r,yy=Math.sin(a)*r*.34;x.fillStyle=i%3===0?'rgba(155,120,255,.95)':'rgba(120,255,255,.9)';x.beginPath();x.arc(xx,yy,2.1,0,6.283);x.fill()}x.restore()}
function frame(){requestAnimationFrame(frame);t+=.016;sc=L(sc,target,.055);sm.x=L(sm.x,mouse.x,.06);sm.y=L(sm.y,mouse.y,.06);x.fillStyle='#030408';x.fillRect(0,0,W,H);let bg=x.createRadialGradient(W*.6,H*.49,0,W*.6,H*.49,Math.max(W,H)*.7);bg.addColorStop(0,'rgba(25,43,58,.23)');bg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=bg;x.fillRect(0,0,W,H);let cx=(sm.x-W*.6)*.72,cy=(sm.y-H*.49)*.72,A=[];for(let i=0;i<N;i++){let p=P[i],a=Math.atan2(p.sz,p.sx)+t*.055+p.p*.008,r=Math.hypot(p.sx,p.sz),cr=62+(i%13)*7,f=sc,tx=Math.cos(a)*(r*(1-f*.78)+cr*f),ty=p.sy*(1-f*.68)+Math.sin(a*2+p.p)*18*f,tz=Math.sin(a)*(r*(1-f*.78)+cr*f),xx=L(p.x,tx,.075),yy=L(p.y,ty,.075),zz=L(p.z,tz,.075),dx=xx-cx,dy=yy-cy,d=Math.hypot(dx,dy),inf=Math.max(0,1-d/260),force=(f>.58?-30:30)*inf;xx+=dx/(d||1)*force;yy+=dy/(d||1)*force;p.x=xx;p.y=yy;p.z=zz;A.push({...proj(xx,yy,zz),h:p.h,size:p.size})}A.sort((a,b)=>b.s-a.s);x.lineWidth=.55;for(let i=0;i<A.length;i+=2){let a=A[i],bd=95+sc*45,best=null;for(let j=Math.max(0,i-55);j<Math.min(A.length,i+55);j++){if(i===j)continue;let b=A[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=b}}if(best){x.strokeStyle='rgba(105,225,255,'+((1-bd/(95+sc*45))*(.1+sc*.32))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(best.x,best.y);x.stroke()}}for(let q of A){x.fillStyle=q.h>.78?'rgba(145,115,255,.75)':'rgba(125,245,255,.78)';x.beginPath();x.arc(q.x,q.y,Math.max(.45,q.size*q.s),0,6.283);x.fill()}core(sc);let cg=x.createRadialGradient(sm.x,sm.y,0,sm.x,sm.y,150);cg.addColorStop(0,'rgba(125,250,255,.075)');cg.addColorStop(1,'rgba(125,250,255,0)');x.fillStyle=cg;x.beginPath();x.arc(sm.x,sm.y,150,0,6.283);x.fill()}frame()})();
</script></body></html>
