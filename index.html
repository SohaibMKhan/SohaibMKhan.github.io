<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sohaib — Data Core</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#030408;color:#f5f7fb;font-family:Inter,Arial,sans-serif;overflow-x:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;background:#030408}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:28px 34px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.18em;font-size:10px;opacity:.74}
.status{display:flex;gap:9px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#7ff7ff;box-shadow:0 0 18px #7ff7ff}
.hero{margin:auto 0 11vh;max-width:720px}.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.56;margin-bottom:18px}
h1{margin:0;font-size:clamp(50px,8vw,118px);line-height:.88;letter-spacing:-.065em;font-weight:500}h1 span{display:block}.accent{opacity:.78}
.sub{margin-top:28px;max-width:470px;font-size:15px;line-height:1.7;color:#aeb5c0}
.scroll{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}.line{width:54px;height:1px;background:#777}
.section{height:500vh;position:relative;z-index:4;pointer-events:none}.marker{position:absolute;left:34px;top:0;height:100vh;display:flex;align-items:center}.marker span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.28em;text-transform:uppercase;opacity:.2}
.badge{position:fixed;right:34px;bottom:30px;z-index:5;font:9px monospace;letter-spacing:.15em;opacity:.28}
@media(max-width:700px){.hud{padding:22px}.hero{margin-bottom:13vh}.marker{left:22px}.sub{font-size:14px;max-width:330px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <div class="top"><div>SOHAIB / DATA CORE</div><div class="status"><i class="dot"></i>SYSTEM ONLINE</div></div>
  <div class="hero"><div class="eyebrow">Data · Intelligence · Technology</div><h1><span>Build.</span><span class="accent">Connect.</span><span>Transform.</span></h1><div class="sub">An interactive portfolio where data, intelligence and software become one living system.</div></div>
  <div class="scroll"><div class="line"></div>Move your cursor · Scroll to activate</div>
</div>
<div class="section"><div class="marker"><span>01 — CORE FORMATION</span></div></div>
<div class="badge">DATA CORE / V5</div>
<script>
(()=>{const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const N=1050,pts=[];for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,r=170+Math.random()*Math.max(W,H)*.58;pts.push({x:Math.cos(a)*r,y:(Math.random()-.5)*Math.max(W,H)*.78,z:Math.sin(a)*r,sx:Math.cos(a)*r,sy:(Math.random()-.5)*Math.max(W,H)*.78,sz:Math.sin(a)*r,phase:Math.random()*Math.PI*2,size:.55+Math.random()*1.45,hue:Math.random()})}
const mouse={x:W*.72,y:H*.5},sm={x:mouse.x,y:mouse.y};let targetScroll=0,scroll=0,time=0;addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;targetScroll=max>0?scrollY/max:0},{passive:true});addEventListener('wheel',e=>{targetScroll=Math.max(0,Math.min(1,targetScroll+e.deltaY/innerHeight*.12))},{passive:true});function lerp(a,b,t){return a+(b-a)*t}function project(x,y,z){const cam=720,zz=cam+z,scale=cam/Math.max(150,zz);return{x:W*.60+x*scale,y:H*.49+y*scale,s:scale}}
function drawCore(f){const cx=W*.60,cy=H*.49;ctx.save();ctx.translate(cx,cy);const glow=ctx.createRadialGradient(0,0,0,0,0,190);glow.addColorStop(0,'rgba(140,255,255,.28)');glow.addColorStop(.12,'rgba(100,225,255,.16)');glow.addColorStop(.42,'rgba(90,110,255,.06)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,190,0,Math.PI*2);ctx.fill();const nucleus=ctx.createRadialGradient(-12,-15,2,0,0,48+f*14);nucleus.addColorStop(0,'rgba(245,255,255,.95)');nucleus.addColorStop(.12,'rgba(150,255,255,.8)');nucleus.addColorStop(.42,'rgba(65,210,255,.28)');nucleus.addColorStop(1,'rgba(30,80,180,0)');ctx.fillStyle=nucleus;ctx.beginPath();ctx.arc(0,0,60+f*14,0,Math.PI*2);ctx.fill();ctx.rotate(time*.08);for(let layer=0;layer<3;layer++){const rr=(64+layer*22)*(1+f*.16);ctx.beginPath();for(let i=0;i<=12;i++){const a=i/12*Math.PI*2,wobble=1+Math.sin(a*3+time+layer)*.035,x=Math.cos(a)*rr*wobble,y=Math.sin(a)*rr*.72*wobble;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.strokeStyle=layer===1?'rgba(165,125,255,.65)':'rgba(105,250,255,.65)';ctx.lineWidth=1.1;ctx.stroke()}for(let k=0;k<5;k++){const rr=(110+k*25)*(1+f*.18);ctx.save();ctx.rotate(time*(.035+k*.012)+(k*Math.PI/5));ctx.beginPath();ctx.ellipse(0,0,rr,rr*(.22+k*.045),0,0,Math.PI*2);ctx.strokeStyle=k%2?'rgba(135,100,255,.42)':'rgba(100,245,255,.48)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}ctx.strokeStyle='rgba(220,255,255,.32)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-105,0);ctx.lineTo(105,0);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-105);ctx.lineTo(0,105);ctx.stroke();for(let i=0;i<12;i++){const a=time*.35+i*Math.PI*2/12,rr=145+Math.sin(time+i)*10+f*35,x=Math.cos(a)*rr,y=Math.sin(a)*rr*.34;ctx.fillStyle=i%3===0?'rgba(155,120,255,.95)':'rgba(120,255,255,.9)';ctx.shadowBlur=12;ctx.shadowColor=i%3===0?'#8d6cff':'#7ff7ff';ctx.beginPath();ctx.arc(x,y,2.1,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.restore()}
function frame(){requestAnimationFrame(frame);time+=.016;scroll=lerp(scroll,targetScroll,.055);sm.x=lerp(sm.x,mouse.x,.06);sm.y=lerp(sm.y,mouse.y,.06);ctx.fillStyle='#030408';ctx.fillRect(0,0,W,H);const bg=ctx.createRadialGradient(W*.60,H*.49,0,W*.60,H*.49,Math.max(W,H)*.7);bg.addColorStop(0,'rgba(25,43,58,.23)');bg.addColorStop(.36,'rgba(9,17,27,.10)');bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const cursorX=(sm.x-W*.60)*.72,cursorY=(sm.y-H*.49)*.72,projected=[];for(let i=0;i<N;i++){const p=pts[i],f=scroll,a=Math.atan2(p.sz,p.sx)+time*.055+p.phase*.008,radius=Math.hypot(p.sx,p.sz),coreRadius=62+(i%13)*7,tx=Math.cos(a)*(radius*(1-f*.78)+coreRadius*f),ty=p.sy*(1-f*.68)+Math.sin(a*2+p.phase)*18*f,tz=Math.sin(a)*(radius*(1-f*.78)+coreRadius*f);let x=lerp(p.x,tx,.075),y=lerp(p.y,ty,.075),z=lerp(p.z,tz,.075),dx=x-cursorX,dy=y-cursorY,d=Math.hypot(dx,dy),inf=Math.max(0,1-d/260),force=(f>.58?-30:30)*inf;x+=dx/(d||1)*force;y+=dy/(d||1)*force;p.x=x;p.y=y;p.z=z;projected.push({...project(x,y,z),worldX:x,worldY:y,hue:p.hue,size:p.size})}projected.sort((a,b)=>b.s-a.s);ctx.lineWidth=.55;const connectionStrength=.10+scroll*.32;for(let i=0;i<projected.length;i+=2){const a=projected[i],limit=95+scroll*45;let best=null,bestD=limit;for(let j=Math.max(0,i-55);j<Math.min(projected.length,i+55);j++){if(i===j)continue;const b=projected[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<bestD){bestD=d;best=b}}if(best){const alpha=(1-bestD/limit)*connectionStrength;ctx.strokeStyle=`rgba(105,225,255,${alpha})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(best.x,best.y);ctx.stroke()}}for(const q of projected){const alpha=Math.max(.08,Math.min(.88,1-q.s*.2))*(.7+scroll*.35),r=Math.max(.45,q.size*q.s);ctx.fillStyle=q.hue>.78?`rgba(145,115,255,${alpha})`:`rgba(125,245,255,${alpha})`;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill()}drawCore(scroll);const cg=ctx.createRadialGradient(sm.x,sm.y,0,sm.x,sm.y,150);cg.addColorStop(0,'rgba(125,250,255,.075)');cg.addColorStop(1,'rgba(125,250,255,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(sm.x,sm.y,150,0,Math.PI*2);ctx.fill();const vg=ctx.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.18,W*.5,H*.48,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(.64,'rgba(0,0,0,.10)');vg.addColorStop(1,'rgba(0,0,0,.82)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}frame()})();
</script>
</body>
</html>
